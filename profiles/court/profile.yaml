name: 法院 Profile
role: court
# 启用能力：阅卷、汇聚、核验、要件匹配、文书校对（开发文档 5.2、5.6）
enabled_agents:
  - reader        # 阅卷 Agent
  - aggregator    # 汇聚器
  - verifier      # 核验器
  - element_matcher
  - doc_proofread # 文书校对
# 禁用能力：所有策略类插件、胜算评估、抗辩预演、裁判倾向分析
disabled_tools:
  - strategy
  - win_eval
  - defense_rehearsal
  - verdict_tendency
data_dir: data/court
output_rules:
  - 保持绝对中立，不给出倾向性结论
  - 明确标注辅助性质
# 引导动线（v0.4 P1）：首屏向导四步，前端按本段数据渲染，不按 role 分支。
guide:
  - title: 建案
    text: 先新建一个案件。材料都按案件归档，切换案件即切换全部上下文，不跨案串用。
    action: new-case
  - title: 卷宗接入
    text: 拖入或选择卷宗文件（支持 PDF / txt / md / docx；扫描识别需要文字识别组件，未配置时会明确拒绝，不会悄悄降级）。经扫描识别的文书会在列表中标注「扫描识别文本」，需人工校对。
    action: import-doc
  - title: 整理事实
    text: 在文书中核对原文、逐条录入事实。系统自动标注每条事实的可靠程度：原文核对过且多来源一致 / 有出处但仅一方来源 / 对方主张未核实 / 说法互相矛盾 / 未找到来源。
    action: document
  - title: 审校与报告
    text: 出报告前系统逐项检查：引用有无出处、与原文是否一致、可靠程度标注是否合规、敏感信息是否遮蔽、推理链是否完整；未通过检查的报告不会导出。报告默认隐去个人信息后导出，全程留记录。
    action: report
