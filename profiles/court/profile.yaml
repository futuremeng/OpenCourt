name: 法院 Profile
role: court
# 启用能力：阅卷、汇聚、核验、要件匹配、文书校对（开发文档 5.2、5.6）
enabled_agents:
  - reader        # 阅卷 Agent
  - aggregator    # 汇聚器
  - verifier      # 核验器
  - element_matcher
  - doc_proofread # 文书校对
# 禁用能力：所有策略类插件、胜算评估、抗辩预演、裁判倾向分析
disabled_tools:
  - strategy
  - win_eval
  - defense_rehearsal
  - verdict_tendency
data_dir: data/court
output_rules:
  - 保持绝对中立，不给出倾向性结论
  - 明确标注辅助性质
# 引导动线（v0.4 P1）：首屏向导四步，前端按本段数据渲染，不按 role 分支。
guide:
  - title: 建案
    text: 为本次阅卷新建一个案件。事实、文书、检索结果均按案件隔离：一切数据以案件编号为边界，切换案件即切换全部上下文，不跨案串用。
    action: new-case
  - title: 卷宗接入
    text: 拖入或选择卷宗文件（PDF / txt / md / docx；扫描件需 OCR 引擎，引擎缺失时明确拒绝、不降级）。OCR 来源与弱态材料在「文档阅卷」面板显式标注。
    action: import-doc
  - title: 阅卷与事实板
    text: 在文书中核对原文、录入事实。事实按状态机判定入五态：已溯源确认 / 单源未补强 / 对方主张未验证 / 存在冲突 / 无依据。
    action: document
  - title: 产出审校报告
    text: 执行审校（确定性检查：引用核验、回原文一致性、五态合规、脱敏复查、推理链完整性），报告默认脱敏导出并留审计。
    action: report
