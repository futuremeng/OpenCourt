name: 当事人轻量视图
role: party
# 仅展示案件进度、待补材料、风险提示（开发文档 5.5、5.6）
enabled_agents:
  - progress_query  # 进度查询
  - material_remind # 材料提醒
# 禁用所有推演工具：不向当事人开放策略推理过程或复杂逻辑推演结果
disabled_tools:
  - strategy
  - win_eval
  - defense_rehearsal
  - verdict_tendency
  - doc_proofread
  - evidence_challenge
  - reasoning
data_dir: data/party
output_rules:
  - 不包含策略推理、证据分析、对方主张等敏感信息
