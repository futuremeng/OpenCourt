# OpenCourt 主配置示例（复制为 config/settings.yaml 后按需修改）
# 所有字段均可被 OPENCOURT_* 环境变量覆盖，例如：
#   OPENCOURT_PROFILE_ACTIVE=plaintiff
#   OPENCOURT_TELEMETRY=false
# 敏感信息（API Key、密码）严禁写入本文件，请经 .env 注入。

env: dev

profile:
  active: court          # court / plaintiff / defendant / party

model:
  # 统一 OpenAI 兼容接口，不假定服务商：base_url 可指向 OpenAI、
  # 云厂商兼容端点，或本地 OpenAI 兼容服务
  # （LM Studio / llama.cpp server / vLLM / Ollama 的 /v1 等）
  provider: openai
  base_url: https://api.openai.com/v1
  api_key_env: OPENCOURT_API_KEY # Key 严禁写入本文件，仅配置环境变量名
  reasoning_model: gpt-4o-mini
  embedding_model: text-embedding-3-small
  enabled: false                 # 默认离线：显式启用后才会发起模型调用

retrieve:
  vector_dim: 768
  top_k: 5

security:
  redact_level: high     # low / medium / high
  telemetry_enabled: false  # 默认关闭任何形式的数据上报，开启需二次确认

openlaw:
  # OpenLaw 法条源（M4 对接）：指向 OpenLaw 数据目录（含 db/ pdf/ md/
  # provenance/ manifest/）。留空 = 未配置，法条检索降级不可用。
  # 开发期示例：/Users/<you>/github/futuremeng/OpenLaw/data
  data_dir: ""

browseros:
  # 浏览器辅助（外部可选组件，默认禁用）：用户自装 BrowserOS neo 的
  # MCP 端点。打开 BrowserOS neo → 新标签页 → 侧栏 MCP → 复制顶部 URL。
  # 端口随其构建变化（如 http://127.0.0.1:9211/mcp），不要照抄示例。
  # 留空或 enabled=false = 联网查阅功能不可用（默认离线安全）。
  endpoint: ""
  enabled: false

localcases:
  # 类案源（外部可选组件，默认禁用）：指向用户自装 LocalCases 的回环 HTTP 服务。
  # 留空或 enabled=false = 类案检索不可用（默认离线安全）。
  # LC-6 发现文件未就绪前，base_url + token_env 是手动临时通道（UI 已标注）；
  # token 严禁写入本文件——只填环境变量名，token 值经该环境变量注入。
  base_url: ""            # 例 http://127.0.0.1:5010
  token_env: ""           # 例 LOCALCASES_TOKEN
  enabled: false

data_dir: data
