name: ci

# 门禁：go.mod 用 replace 指向仓库外的 ../OpenLaw（本地开发形态），CI 必须先把
# OpenLaw 取到工作区内再改写 replace，否则模块解析直接失败：
#   github.com/futuremeng/OpenLaw@v0.0.0: replacement directory ../OpenLaw does not exist
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  OPENLAW_REF: main

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout OpenLaw into workspace
        uses: actions/checkout@v4
        with:
          repository: futuremeng/OpenLaw
          ref: ${{ env.OPENLAW_REF }}
          path: .deps/OpenLaw

      - name: Point replace directive at the checked-out copy
        run: go mod edit -replace github.com/futuremeng/OpenLaw=./.deps/OpenLaw

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))" || (gofmt -l $(git ls-files '*.go'); echo "请运行 make fmt"; exit 1)

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # -race：Wails 每次绑定调用在独立 goroutine 中执行，App 上的共享状态
      # （当前案件 ID、法条源句柄、配置）必须被竞态检测覆盖。
      - name: Test (race)
        run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # Wails 桌面壳构建冒烟（go:embed frontend/dist + 绑定生成），与发布同路径
  desktop:
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: futuremeng/OpenLaw
          ref: ${{ env.OPENLAW_REF }}
          path: .deps/OpenLaw
      - run: go mod edit -replace github.com/futuremeng/OpenLaw=./.deps/OpenLaw
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install system deps (webkit/gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxss1
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Build frontend assets
        working-directory: frontend
        run: npm ci && npm run build
      - name: wails build
        run: wails build -clean -tags webkit2_41
