name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: OpenCourt-linux
          - os: windows-latest
            artifact: OpenCourt.exe
          - os: macos-latest
            artifact: OpenCourt-macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # go.mod 的 replace 指向仓库外的 ../OpenLaw（本地开发形态）。CI 工作区里
      # 没有这个目录，模块解析会直接失败——故先取进工作区再改写 replace。
      - name: Checkout OpenLaw into workspace
        uses: actions/checkout@v4
        with:
          repository: futuremeng/OpenLaw
          ref: main
          path: .deps/OpenLaw

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 必须在 setup-go 之后：macOS runner 不预装 Go，早于此步会 command not found
      # （Linux/Windows 镜像自带 Go 才掩盖了这个顺序 bug）。
      - name: Point replace directive at the checked-out copy
        run: go mod edit -replace github.com/futuremeng/OpenLaw=./.deps/OpenLaw

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux system deps (webkit/gtk)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxss1

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Verify tests
        run: go test -race ./...

      - name: Build
        shell: bash
        run: |
          # 版本单一来源：发布 tag 注入 main.version（去 v 前缀：前端已有 v{{ version }}
          # 拼接，带前缀会渲染成 vv；未打 tag 的手动触发保留代码内默认值）
          LDFLAGS=""
          if [ -n "${GITHUB_REF_NAME}" ] && [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            LDFLAGS="-ldflags=-X=main.version=${GITHUB_REF_NAME#v}"
          fi
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            wails build -clean -tags webkit2_41 $LDFLAGS
          else
            wails build -clean $LDFLAGS
          fi

      - name: Package artifact
        shell: bash
        run: |
          cd build/bin
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            # 版本注入：.app 的 Info.plist 两个版本字段来自 wails.json 的
            # productVersion 模板值（本地构建的显示值），发布时必须以去 v 的
            # tag 覆盖，否则「关于」面板停在陈旧值。workflow_dispatch 无 tag
            # 不注入（与 Build 步骤的 ldflags 同一事件判据）。
            if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              ver="${GITHUB_REF_NAME#v}"
              plutil -replace CFBundleShortVersionString -string "$ver" OpenCourt.app/Contents/Info.plist
              plutil -replace CFBundleVersion -string "$ver" OpenCourt.app/Contents/Info.plist
              # plutil 改动 bundle 资源会破坏 wails build 已打的 ad-hoc 签名封印，
              # 必须重新签名后再 zip（OpenLaw build-app.sh 同构：签名 + 自检）。
              codesign --force --sign - OpenCourt.app
              codesign --verify --verbose=2 OpenCourt.app
            fi
            zip -r ../../${{ matrix.artifact }}.zip OpenCourt.app
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp OpenCourt.exe ../../${{ matrix.artifact }}
          else
            zip -r ../../${{ matrix.artifact }}.zip OpenCourt
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}*

  # tag 推上去不能只把制品存进 Actions（90 天过期），必须创建 GitHub Release
  # 才算对外发布；重复跑同一 tag 时替换旧资产而非报错（LocalCases 同构写法）。
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # tag 是版本声明，必须与源码默认值互检（LocalCases 同构）：在 main.go
      # 仍写旧值的树上发 v0.4.0，「版本单一来源」在 ldflags 注入处第一次断裂。
      - name: the tag is the version
        run: |
          src=$(sed -n 's/^var version = "\([^"]*\)"/\1/p' main.go | head -1)
          if [ "${GITHUB_REF_NAME#v}" != "$src" ]; then
            echo "tag ${GITHUB_REF_NAME} 去 v 后与 main.go 默认值 $src 不一致" >&2
            exit 1
          fi
          echo "OpenCourt $src"

      - uses: actions/download-artifact@v4
        with:
          path: bundles

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          first=$(find bundles -type f | head -1)
          if [ -z "$first" ]; then
            echo "build 作业没有产出任何安装包" >&2
            exit 1
          fi

          # 重命名成可读且标架构的名字：macOS runner 是 Apple Silicon，
          # 非 universal，资产名不再沿用构建期的误导命名。
          version=${GITHUB_REF_NAME#v}
          mkdir -p dist
          for f in $(find bundles -type f | sort); do
            case "$f" in
              *OpenCourt-linux.zip) cp "$f" "dist/OpenCourt-$version-linux-amd64.zip" ;;
              *OpenCourt-macos-universal.zip) cp "$f" "dist/OpenCourt-$version-macos-arm64.app.zip" ;;
              *OpenCourt.exe) cp "$f" "dist/OpenCourt-$version-windows-amd64.exe" ;;
              *) echo "预期外的制品: $f" >&2; exit 1 ;;
            esac
          done
          (cd dist && sha256sum *) > SHA256SUMS
          cat SHA256SUMS

          cat > notes.md <<'MD'
          开源视听庭审辅助工具。安装包附 SHA256SUMS：`sha256sum -c SHA256SUMS`。
          界面左下角版本号与本 Release 的 tag 一致（发版流水线经 ldflags 注入，
          macOS 包另将版本写入 Info.plist，「关于」面板同源）。

          首次启动提示：macOS 包为 ad-hoc 签名、未经 Apple 公证，首次打开若被
          Gatekeeper 拦截，请右键应用 →「打开」，或执行
          `xattr -d com.apple.quarantine OpenCourt.app` 后重试。
          Windows 安装包未代码签名，SmartScreen 提示时请点「更多信息」→「仍要运行」。
          运行前可用 `sha256sum -c SHA256SUMS` 核对文件完整性。
          MD

          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber dist/* SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "OpenCourt $GITHUB_REF_NAME" \
              --notes-file notes.md \
              dist/* SHA256SUMS
          fi
